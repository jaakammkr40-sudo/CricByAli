name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Generate Android scaffold
        run: |
          cp pubspec.yaml pubspec_backup.yaml
          flutter create . --project-name cric_by_ali --org com.alfatah429eb
          cp pubspec_backup.yaml pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="CricByAli"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CricByAli-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
